name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository; it checks out, builds, and uploads artifacts (which use
# their own runtime token). Without this the job takes whatever the repository default is.
permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Nothing here runs or packages the desktop app, so it does not need JetBrains Runtime - and
  # asking for one made every job depend on setup-java's JBR lookup, an unauthenticated GitHub API
  # call rate-limited per runner IP that was failing roughly a quarter of the time. Set as an
  # ORG_GRADLE_PROJECT_ env var rather than a -P flag so every Gradle invocation picks it up.
  ORG_GRADLE_PROJECT_jbrSkip: "true"

jobs:
  build:
    name: Run checks and upload reports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # cache-provider: basic is required, not a tuning knob. v6 extracted caching into
      # gradle-actions-caching, a proprietary component outside the action's MIT license whose
      # Terms of Use you accept by using it; 'basic' selects the MIT implementation instead.
      # The default is 'enhanced', so dropping this line opts into the proprietary component.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The potassium composite actions and the potassium Gradle plugin / updater library are the
      # same project, so a release should run the actions from the version it builds against.
      # Nothing couples them: the catalog version moves on its own (refreshVersions), and the
      # action refs are string literals GitHub cannot interpolate, so they drift silently and a
      # release quietly runs an older action. Fail here instead, while it is still cheap to fix.
      - name: Potassium action refs match the catalog version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^potassium = "\([^"]*\)"$/\1/p' gradle/libs.versions.toml)
          if [ -z "$version" ]; then
            echo "Could not read the potassium version from gradle/libs.versions.toml" >&2
            exit 1
          fi
          status=0
          while read -r file ref; do
            if [ "$ref" != "$version" ]; then
              echo "$file pins a potassium action at v$ref, but the catalog builds against $version" >&2
              status=1
            fi
          done < <(grep -rno 'sproctor/potassium/[^@]*@v[^ ]*' .github/workflows/ |
            sed 's|^\([^:]*\):[0-9]*:.*@v|\1 |')
          if [ "$status" -ne 0 ]; then
            echo "Bump the action refs to v$version (or the catalog to match)." >&2
            exit 1
          fi
          echo "potassium actions and catalog agree on $version"

      # `check` covers the JVM tests, ktlint, the commonTest suites compiled against the Android
      # target (testAndroidHostTest, run on the host JVM so they exercise the androidMain actuals),
      # and Android Lint: lintAndroidMain and lintJvm in every KMP module plus the app's lint.
      #
      # Lint is the one check that knows which Java APIs Android lacks: Path.of is Java 11 but only
      # reached Android in API 34. We shipped that accidentally, this check should prevent issues
      # like that in the future.
      - name: Checks
        run: ./gradlew check -PiosSkip=true --continue --stacktrace

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          retention-days: 3
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
