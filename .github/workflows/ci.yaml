name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository; it checks out, builds, and uploads artifacts (which use
# their own runtime token). Without this the jobs take whatever the repository default is.
permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Nothing here runs or packages the desktop app, so it does not need JetBrains Runtime - and
  # asking for one made every job depend on setup-java's JBR lookup, an unauthenticated GitHub API
  # call rate-limited per runner IP that was failing roughly a quarter of the time. Set as an
  # ORG_GRADLE_PROJECT_ env var rather than a -P flag so it also reaches the Gradle that the Xcode
  # build phase starts, which this workflow does not invoke directly.
  ORG_GRADLE_PROJECT_jbrSkip: "true"

jobs:
  build:
    name: Run checks and upload report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # cache-provider: basic is required, not a tuning knob. v6 extracted caching into
      # gradle-actions-caching, a proprietary component outside the action's MIT license whose
      # Terms of Use you accept by using it; 'basic' selects the MIT implementation instead.
      # The default is 'enhanced', so dropping this line opts into the proprietary component.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The potassium composite actions and the potassium Gradle plugin / updater library are the
      # same project, so a release should run the actions from the version it builds against.
      # Nothing couples them: the catalog version moves on its own (refreshVersions), and the
      # action refs are string literals GitHub cannot interpolate, so they drift silently and a
      # release quietly runs an older action. Fail here instead, while it is still cheap to fix.
      - name: Potassium action refs match the catalog version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^potassium = "\([^"]*\)"$/\1/p' gradle/libs.versions.toml)
          if [ -z "$version" ]; then
            echo "Could not read the potassium version from gradle/libs.versions.toml" >&2
            exit 1
          fi
          status=0
          while read -r file ref; do
            if [ "$ref" != "$version" ]; then
              echo "$file pins a potassium action at v$ref, but the catalog builds against $version" >&2
              status=1
            fi
          done < <(grep -rno 'sproctor/potassium/[^@]*@v[^ ]*' .github/workflows/ |
            sed 's|^\([^:]*\):[0-9]*:.*@v|\1 |')
          if [ "$status" -ne 0 ]; then
            echo "Bump the action refs to v$version (or the catalog to match)." >&2
            exit 1
          fi
          echo "potassium actions and catalog agree on $version"

      # Lint and the Android-target test suites have their own job below; -x prunes the host
      # tests and everything only they need, so they do not run twice per push.
      - name: Checks
        run: ./gradlew check -PiosSkip=true -PlintSkip=true -x testAndroidHostTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          retention-days: 3
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  # Android Lint plus the test suites compiled for the Android target. Lint is the one check
  # that knows which Java APIs Android lacks: Path.of is Java 11 but only reached Android in
  # API 34, and v3.1.0 shipped it in a shared JVM+Android source set and crashed on launch on
  # every device before Android 14, with ktlint, the compiler and every test green. The KMP
  # modules only get lint tasks once com.android.lint is applied (see their build files), and
  # the build job drops lint with -PlintSkip=true, so it lives here.
  #
  # The tests are the commonTest suites of the KMP modules compiled against the Android target
  # and run on the host JVM (testAndroidHostTest). They exercise the androidMain actuals rather
  # than the jvmMain ones, but they run on the host JDK, so they cannot catch an API-level
  # problem like the one above - that is lint's job. The app's own unit tests stay with `check`
  # in the build job, which already runs them.
  android:
    name: Android lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # See the note on cache-provider in the build job.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # lintAndroidMain (every KMP module) plus the app's lint, rather than the `lint` umbrella:
      # that also runs each module's lintJvm, which compiles the JVM targets the build job
      # already compiles and has no Android context to check against. Time is the whole
      # reason this job exists apart from `check`.
      - name: Android lint
        run: ./gradlew lintAndroidMain :androidApp:lint -PiosSkip=true --stacktrace

      # Still runs when lint fails, so one push reports both.
      - name: Android tests
        if: ${{ !cancelled() }}
        run: ./gradlew testAndroidHostTest -PiosSkip=true --stacktrace

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          retention-days: 3
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  # Runs the shared commonTest suites against the Kotlin/Native target, which the Linux job only
  # ever runs on the JVM. Separate from the app build below rather than a step in it: the two share
  # no outputs - one compiles for the simulator, the other for a device - so sequencing them only
  # added their times together.
  ios-tests:
    name: Run iOS tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # See the note on cache-provider in the build job.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: iOS tests
        run: ./gradlew iosSimulatorArm64Test -PiosSkip=false -PlintSkip=true --stacktrace

      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          retention-days: 3
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  # The Linux job above builds with -PiosSkip=true, because it cannot compile Apple targets. That
  # left the iOS build unexercised, and it rotted: JVM-only calls reached commonMain, the Xcode
  # build phase stopped passing -PiosSkip=false, and the IDE build path silently shipped an app
  # with no Compose resources. This job is what catches that class of breakage.
  ios:
    name: Build iOS app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # See the note on cache-provider in the build job.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The whole chain the Gradle tasks alone do not cover: the Xcode build phase, the Compose
      # resource sync into the bundle, Swift Package resolution for Sentry, and linking the app.
      # Unsigned, so it needs no certificates.
      #
      # Release, not Debug: the Sentry startup in iOSApp.swift sits behind `#if !DEBUG`, so a Debug
      # build never compiles it. That is not hypothetical -- a Sentry API change broke exactly that
      # call and a Debug build stayed green.
      #
      # The Kotlin framework is the exception, via KOTLIN_FRAMEWORK_CONFIGURATION (see
      # Config.xcconfig). Linking it optimized took about three quarters of this job - 18 of its 27
      # minutes - and proves nothing about the Swift half that Release is here for. What is left is
      # everything this job was added to catch: that commonMain still compiles for iOS, that the
      # build phase runs, that the resources land, and that the app links. Release-only Kotlin/Native
      # link failures are what this gives up; no workflow builds those, so they surface when the app
      # is archived in Xcode, which follows the app's configuration like any other local build.
      - name: Build the app with Xcode
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            KOTLIN_FRAMEWORK_CONFIGURATION=Debug \
            build
