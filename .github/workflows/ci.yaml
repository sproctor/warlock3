name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    name: Run checks and upload report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JBR
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '25'

      # cache-provider: basic is required, not a tuning knob. v6 extracted caching into
      # gradle-actions-caching, a proprietary component outside the action's MIT license whose
      # Terms of Use you accept by using it; 'basic' selects the MIT implementation instead.
      # The default is 'enhanced', so dropping this line opts into the proprietary component.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Checks
        run: ./gradlew check -PiosSkip=true -PlintSkip=true --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          retention-days: 3
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
