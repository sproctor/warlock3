name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    name: Run checks and upload report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JBR
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '25'

      # cache-provider: basic is required, not a tuning knob. v6 extracted caching into
      # gradle-actions-caching, a proprietary component outside the action's MIT license whose
      # Terms of Use you accept by using it; 'basic' selects the MIT implementation instead.
      # The default is 'enhanced', so dropping this line opts into the proprietary component.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The potassium composite actions and the potassium Gradle plugin / updater library are the
      # same project, so a release should run the actions from the version it builds against.
      # Nothing couples them: the catalog version moves on its own (refreshVersions), and the
      # action refs are string literals GitHub cannot interpolate, so they drift silently and a
      # release quietly runs an older action. Fail here instead, while it is still cheap to fix.
      - name: Potassium action refs match the catalog version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^potassium = "\([^"]*\)"$/\1/p' gradle/libs.versions.toml)
          if [ -z "$version" ]; then
            echo "Could not read the potassium version from gradle/libs.versions.toml" >&2
            exit 1
          fi
          status=0
          while read -r file ref; do
            if [ "$ref" != "$version" ]; then
              echo "$file pins a potassium action at v$ref, but the catalog builds against $version" >&2
              status=1
            fi
          done < <(grep -rno 'sproctor/potassium/[^@]*@v[^ ]*' .github/workflows/ |
            sed 's|^\([^:]*\):[0-9]*:.*@v|\1 |')
          if [ "$status" -ne 0 ]; then
            echo "Bump the action refs to v$version (or the catalog to match)." >&2
            exit 1
          fi
          echo "potassium actions and catalog agree on $version"

      - name: Checks
        run: ./gradlew check -PiosSkip=true -PlintSkip=true --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          retention-days: 3
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  # The Linux job above builds with -PiosSkip=true, because it cannot compile Apple targets. That
  # left the iOS build unexercised, and it rotted: JVM-only calls reached commonMain, the Xcode
  # build phase stopped passing -PiosSkip=false, and the IDE build path silently shipped an app
  # with no Compose resources. This job is what catches that class of breakage.
  ios:
    name: Build iOS app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JBR
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '25'

      # See the note on cache-provider in the build job.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Runs the shared commonTest suites against the Kotlin/Native target, which the Linux job
      # only ever runs on the JVM.
      - name: iOS tests
        run: ./gradlew iosSimulatorArm64Test -PiosSkip=false -PlintSkip=true --stacktrace

      # The whole chain the Gradle tasks alone do not cover: the Xcode build phase, the Compose
      # resource sync into the bundle, Swift Package resolution for Sentry, and linking the app.
      # Unsigned, so it needs no certificates.
      #
      # Release, not Debug: the Sentry startup in iOSApp.swift sits behind `#if !DEBUG`, so a Debug
      # build never compiles it. That is not hypothetical -- a Sentry API change broke exactly that
      # call and a Debug build stayed green.
      - name: Build the app with Xcode
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          retention-days: 3
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
